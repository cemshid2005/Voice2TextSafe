org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Older plugins (e.g. receive_sharing_intent) don't pin a Kotlin jvmTarget,
# so it defaults to the host JDK version and can mismatch AGP's Java 1.8
# default. Downgrade the mismatch from a hard failure to a warning.
kotlin.jvm.target.validation.mode=warning
